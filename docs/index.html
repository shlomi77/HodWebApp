<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>body{margin:0}[hidden]{display:none!important}</style>
<title>סבב דיירים – הוד ירושלים</title>
<meta name="claude:viewport-fit-sides" content="cover">
<script>document.documentElement.lang='he';document.documentElement.dir='rtl';</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Hebrew:wght@400;500;600;700&family=Rubik:wght@500;600;700&display=swap">
<style>
/* Layout: one-screen desk app. Sticky top bar (round + live counters), status tabs, omnibox; apartment cards list with a split-view resident drawer on the right. */
:root{
  --bg:#f3f5f7; --surface:#ffffff; --surface-2:#eef1f4; --line:#dde3e9; --fg:#18242e; --muted:#5d6b78;
  --accent:#0f6e74; --accent-ink:#ffffff; --accent-soft:#dff0f0;
  --pending:#2f5d8a; --pending-soft:#e3ecf6;
  --follow:#b4500d; --follow-soft:#fdebd9;
  --ok:#1d7a4c; --ok-soft:#dcf1e5;
  --away:#6a4c9c; --away-soft:#ece6f6;
  --danger:#b4232c; --danger-soft:#fbe3e4;
  --shadow:0 1px 2px rgba(16,36,48,.06),0 4px 14px rgba(16,36,48,.06);
  --f-display:"Rubik","IBM Plex Sans Hebrew","Segoe UI",Arial,sans-serif;
  --f-body:"IBM Plex Sans Hebrew","Segoe UI",Arial,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f161c; --surface:#16212a; --surface-2:#1c2a35; --line:#2a3a47; --fg:#e6edf2; --muted:#93a3b1;
  --accent:#4fb8b9; --accent-ink:#06282a; --accent-soft:#163a3d;
  --pending:#8db6e2; --pending-soft:#1b2d42; --follow:#f0a463; --follow-soft:#3a2516;
  --ok:#6fd09d; --ok-soft:#143425; --away:#b9a2e6; --away-soft:#2a2340; --danger:#f2858b; --danger-soft:#3d1b1f;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f161c; --surface:#16212a; --surface-2:#1c2a35; --line:#2a3a47; --fg:#e6edf2; --muted:#93a3b1;
  --accent:#4fb8b9; --accent-ink:#06282a; --accent-soft:#163a3d;
  --pending:#8db6e2; --pending-soft:#1b2d42; --follow:#f0a463; --follow-soft:#3a2516;
  --ok:#6fd09d; --ok-soft:#143425; --away:#b9a2e6; --away-soft:#2a2340; --danger:#f2858b; --danger-soft:#3d1b1f;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25); color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16.5px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
#app{display:flex;flex-direction:column;height:100%}

/* top bar */
.top{background:var(--surface);border-bottom:1px solid var(--line);padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-wrap:wrap;gap:10px 22px;align-items:center}
.brand{display:flex;flex-direction:column;line-height:1.15}
.brand b{font-family:var(--f-display);font-size:18px;font-weight:700;letter-spacing:-.01em}
.brand span{color:var(--muted);font-size:12.5px}
.nav{display:flex;gap:4px;flex-wrap:wrap}
.nav button.big{border:1.5px solid var(--accent);color:var(--accent);background:var(--accent-soft)}
.nav button{font-size:16px;border:0;background:transparent;padding:7px 12px;border-radius:8px;color:var(--muted);font-weight:500}
.nav button[aria-current="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav button:hover{color:var(--fg)}
.spacer{flex:1}
.who{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:13px}
.who select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:4px 8px}
.clock{font-family:var(--f-display);font-weight:600;font-size:17px;color:var(--fg)}

/* round header */
.roundbar{padding-block:14px 6px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center}
.roundsel{display:flex;align-items:center;gap:10px}
.roundsel select{font-family:var(--f-display);font-size:20px;font-weight:600;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 10px;max-width:100%}
.rstate{font-size:12.5px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.rstate.live{background:var(--ok-soft);color:var(--ok)}
.progress{flex:1;min-width:220px;display:flex;flex-direction:column;gap:6px}
.pbar{height:10px;border-radius:999px;background:var(--surface-2);overflow:hidden;display:flex}
.pbar i{display:block;height:100%}
.ptext{font-size:13px;color:var(--muted)}
.ptext b{color:var(--fg)}

/* tabs */
.tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.tab{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:9px 12px;display:flex;align-items:center;justify-content:space-between;gap:8px;text-align:start;position:relative}
.tab .lbl{font-weight:600;font-size:16.5px}
.tab .sub{display:block;font-size:13px;color:var(--muted);font-weight:400}
.tab .cnt{font-family:var(--f-display);font-size:28px;font-weight:700;font-variant-numeric:tabular-nums}
.tab[data-s="pending"] .cnt{color:var(--pending)}
.tab[data-s="followup"] .cnt{color:var(--follow)}
.tab[data-s="located"] .cnt{color:var(--ok)}
.tab[data-s="away"] .cnt{color:var(--away)}
.tab[aria-selected="true"]{border-color:transparent;box-shadow:inset 0 0 0 2px var(--c)}
.tab[data-s="pending"]{--c:var(--pending)} .tab[data-s="followup"]{--c:var(--follow)} .tab[data-s="located"]{--c:var(--ok)} .tab[data-s="away"]{--c:var(--away)}
.tab[aria-selected="true"]{background:color-mix(in srgb,var(--c) 9%,var(--surface))}
.tab.alert::after{content:"";position:absolute;top:8px;left:8px;width:8px;height:8px;border-radius:50%;background:var(--follow);animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.tab.alert::after{animation:none}}

/* filters */
.filters{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;padding-block:4px 10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.omni{flex:1 1 320px;position:relative;min-width:0}
.omni input{width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:13px 44px 13px 14px;font-size:18px}
.omni input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.omni .ic{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.omni kbd{position:absolute;left:10px;top:50%;transform:translateY(-50%);font-size:11px;border:1px solid var(--line);border-radius:5px;padding:1px 6px;color:var(--muted);background:var(--surface-2)}
.omni .clr{position:absolute;left:8px;top:50%;transform:translateY(-50%);border:0;background:var(--surface-2);border-radius:6px;padding:2px 8px;color:var(--muted)}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 16px;font-size:15px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chips select{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 10px;font-size:13.5px}

/* main split */
.main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr);grid-template-areas:"list"}
.main.has-drawer{grid-template-columns:minmax(380px,430px) minmax(0,1fr);grid-template-areas:"drawer list"}
.listwrap{grid-area:list;overflow:auto;padding-block:2px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-width:0}
.list{display:flex;flex-direction:column;gap:10px}

.apt{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.apt-h{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;padding:7px 12px;background:var(--surface-2);border-bottom:1px solid var(--line);font-size:13px;color:var(--muted)}
.apt-h .aptno{font-family:var(--f-display);font-weight:700;font-size:16px;color:var(--fg)}
.apt-h .roomloc{margin-inline-start:auto;display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.apt-h .roomloc span{font-weight:600;color:var(--fg)}
.others{font-size:12.5px}
.row{display:grid;grid-template-columns:minmax(190px,1fr) minmax(0,2fr);gap:10px 16px;align-items:center;padding:12px 14px;border-top:1px solid var(--line);cursor:pointer}
.apt .row:first-of-type{border-top:0}
.row:hover{background:color-mix(in srgb,var(--accent) 4%,var(--surface))}
.row.sel{background:var(--accent-soft)}
.row.flash{animation:flash .9s}
@keyframes flash{from{background:var(--ok-soft)}}
.who-c{display:flex;gap:10px;align-items:center;min-width:0}
.av{width:38px;height:38px;flex:none;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:600;font-size:14px;color:#fff}
.nm{min-width:0}
.nm b{font-weight:600;font-size:18px;display:block}
.nm small{color:var(--muted);font-size:14px;display:block}
.tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:3px}
.tag{font-size:11.5px;font-weight:600;padding:1px 7px;border-radius:5px;background:var(--surface-2);color:var(--muted)}
.tag.red{background:var(--danger-soft);color:var(--danger)}
.tag.amb{background:var(--follow-soft);color:var(--follow)}
.tag.grn{background:var(--ok-soft);color:var(--ok)}
.tag.vio{background:var(--away-soft);color:var(--away)}
.acts{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end;align-items:center}
.pill{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px;font-size:13.5px;font-weight:500;white-space:nowrap;display:inline-flex;gap:5px;align-items:center}
.pill:hover{border-color:var(--ok);background:var(--ok-soft);color:var(--ok)}
.pill.no:hover{border-color:var(--follow);background:var(--follow-soft);color:var(--follow)}
.pill.no{color:var(--follow);border-color:color-mix(in srgb,var(--follow) 35%,var(--line))}
.pill.more{padding-inline:9px}
.big{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 16px;font-size:16px;font-weight:600;white-space:nowrap;display:inline-flex;gap:7px;align-items:center;min-height:46px}
.big.yes{border-color:color-mix(in srgb,var(--ok) 45%,var(--line));color:var(--ok)}
.big.yes:hover{background:var(--ok);color:#fff;border-color:var(--ok)}
.big.no{border-color:color-mix(in srgb,var(--follow) 45%,var(--line));color:var(--follow)}
.big.no:hover{background:var(--follow);color:#fff;border-color:var(--follow)}
.big.more{color:var(--muted)}
.big.more:hover{background:var(--surface-2);color:var(--fg)}
.big:disabled{opacity:.4;cursor:not-allowed}
.big:disabled:hover{background:var(--surface);color:var(--ok)}
.drawer .acts{justify-content:flex-start}
details.fold{border-bottom:1px solid var(--line)}
details.fold>summary{list-style:none;cursor:pointer;padding:15px 18px;font-weight:600;font-size:16px;display:flex;justify-content:space-between;align-items:center;gap:8px}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary::after{content:"+";font-size:22px;color:var(--muted);line-height:1}
details.fold[open]>summary::after{content:"−"}
details.fold>summary small{color:var(--muted);font-weight:400;font-size:13.5px;margin-inline-start:auto}
details.fold .sec{border-bottom:0;padding-top:0}
.backbar{display:flex;align-items:center;gap:10px}
.pill:disabled{opacity:.4;cursor:not-allowed;text-decoration:line-through}
.pill.sm{font-size:12.5px;padding:3px 9px}
.pill.undo:hover{border-color:var(--muted);background:var(--surface-2);color:var(--fg)}
.pill.ghost{background:transparent}
.state{font-size:13px;color:var(--muted);text-align:start;flex:1;min-width:0}
.state b{color:var(--fg);font-weight:600}
.row.follow{box-shadow:inset -4px 0 0 var(--follow)}
.empty{padding:40px 16px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:var(--r)}
.empty b{display:block;font-family:var(--f-display);font-size:18px;color:var(--fg);margin-bottom:4px}

/* popover */
.pop{position:fixed;z-index:50;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:6px;min-width:250px}
.pop button{display:block;width:100%;text-align:start;border:0;background:transparent;padding:8px 10px;border-radius:8px}
.pop button{font-size:15px}
.pop button:hover{background:var(--ok-soft);color:var(--ok)}
.pop button.nobtn:hover{background:var(--follow-soft);color:var(--follow)}
.pop button.navbtn:hover{background:var(--accent-soft);color:var(--accent)}
.pop button:disabled{opacity:.4}
.pop h6{margin:4px 10px 6px;font-size:11.5px;color:var(--muted);font-weight:600;letter-spacing:.02em}

/* drawer */
.drawer{grid-area:drawer;border-inline-end:1px solid var(--line);background:var(--surface);overflow:auto;min-width:0;display:flex;flex-direction:column}
.dh{position:sticky;top:0;background:var(--surface);z-index:2;padding:16px 18px 12px;border-bottom:1px solid var(--line);display:flex;gap:14px;align-items:flex-start}
.dh .av{width:64px;height:64px;font-size:22px;border-radius:14px}
.dh h2{margin:0;font-family:var(--f-display);font-size:21px;font-weight:600;line-height:1.2;text-wrap:balance}
.dh .meta{color:var(--muted);font-size:13px;margin-top:2px}
.dh .x{margin-inline-start:auto;border:0;background:var(--surface-2);border-radius:8px;width:32px;height:32px;font-size:18px;flex:none}
.sec{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.sec h3{margin:0;font-size:12px;letter-spacing:.04em;color:var(--muted);font-weight:600;display:flex;justify-content:space-between;align-items:center}
.alertbox{background:var(--danger-soft);color:var(--danger);border-radius:8px;padding:8px 10px;font-weight:600;font-size:14px;display:flex;flex-direction:column;gap:2px}
.alertbox small{font-weight:400;opacity:.85}
.kv{display:grid;grid-template-columns:auto 1fr auto;gap:6px 12px;font-size:14px;align-items:center}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:500}
.copy{border:1px solid var(--line);background:transparent;border-radius:6px;font-size:12px;padding:1px 8px;color:var(--muted)}
.contact{display:flex;justify-content:space-between;gap:10px;align-items:center;font-size:14px;padding:6px 0;border-top:1px dashed var(--line)}
.contact:first-of-type{border-top:0}
.contact small{color:var(--muted)}
.statusline{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sbadge{font-weight:600;font-size:13px;padding:4px 10px;border-radius:999px}
.s-pending{background:var(--pending-soft);color:var(--pending)}
.s-followup{background:var(--follow-soft);color:var(--follow)}
.s-located{background:var(--ok-soft);color:var(--ok)}
.s-away{background:var(--away-soft);color:var(--away)}
.frm{display:flex;flex-direction:column;gap:8px}
.frm .r{display:flex;gap:8px;flex-wrap:wrap}
.frm select,.frm input,.frm textarea{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 10px;min-width:0;flex:1}
.frm textarea{resize:vertical;min-height:58px}
.btn{border:0;border-radius:9px;padding:9px 16px;font-weight:600;font-size:14.5px}
.btn.ok{background:var(--ok);color:#fff}
.btn.no{background:var(--follow);color:#fff}
.btn.pri{background:var(--accent);color:var(--accent-ink)}
.btn.sec2{background:var(--surface-2);color:var(--fg)}
.btn.vio{background:var(--away);color:#fff}
.seg{display:flex;gap:6px}
.seg button{flex:1;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px;font-weight:600}
.seg button[aria-pressed="true"]{border-color:var(--away);background:var(--away-soft);color:var(--away)}
.log{display:flex;flex-direction:column;gap:6px;font-size:13.5px}
.log .it{padding:8px 10px;background:var(--surface-2);border-radius:8px}
.log .it small{color:var(--muted);display:block;font-size:12px}
.mvcard{border:1px solid color-mix(in srgb,var(--away) 40%,var(--line));background:var(--away-soft);border-radius:10px;padding:10px 12px;display:flex;justify-content:space-between;gap:10px;align-items:center;font-size:14px}
.ticket{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.tst{font-size:11.5px;font-weight:600;padding:1px 8px;border-radius:5px;white-space:nowrap}
.tst.open{background:var(--follow-soft);color:var(--follow)}
.tst.prog{background:var(--pending-soft);color:var(--pending)}
.tst.done{background:var(--ok-soft);color:var(--ok)}
.linkish{border:0;background:none;color:var(--accent);padding:0;font-weight:600}

/* other screens */
.screen{padding-block:16px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:12px}
.screen h1{margin:0;font-family:var(--f-display);font-size:24px;font-weight:600}
.screen .lead{color:var(--muted);margin:0;max-width:65ch}
.tbl{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;font-size:14px}
th{font-size:12px;color:var(--muted);font-weight:600;text-align:start;padding:9px 12px;background:var(--surface-2);white-space:nowrap}
td{padding:9px 12px;border-top:1px solid var(--line);vertical-align:top}
td.n{white-space:nowrap;font-variant-numeric:tabular-nums}

.toast{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);border-radius:12px;padding:10px 12px 10px 16px;display:flex;gap:14px;align-items:center;box-shadow:var(--shadow);z-index:60;font-size:14px;max-width:calc(100% - 32px)}
.toast button{border:0;background:color-mix(in srgb,var(--bg) 18%,transparent);color:var(--bg);border-radius:8px;padding:5px 12px;font-weight:600}
.demo{font-size:12px;color:var(--muted);padding-block:6px 10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.demo button{border:0;background:none;color:var(--accent);padding:0;font-size:12px;text-decoration:underline}

@media (max-width:900px){
  .main.has-drawer{grid-template-columns:minmax(0,1fr);grid-template-areas:"list"}
  .drawer{position:fixed;inset:0;z-index:40;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
  .row{grid-template-columns:minmax(0,1fr)}
  .acts{justify-content:flex-start}
  .tabs{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:520px){
  .tab .sub{display:none}
  .roundsel select{font-size:17px}
}
</style>

<div id="app" dir="rtl">
  <header class="top">
    <div class="brand"><b>הוד ירושלים</b><span>קבלה · בדיקת נוכחות</span></div>
    <nav class="nav" id="nav"></nav>
    <div class="spacer"></div>
    <div class="who"><label for="staff">משמרת:</label><select id="staff"></select></div>
    <div class="clock num" id="clock"></div>
  </header>
  <div id="roundArea">
    <div class="roundbar">
      <div class="roundsel"><select id="roundSel" aria-label="בחירת סבב"></select><span class="rstate" id="rstate"></span></div>
      <div class="progress"><div class="pbar" id="pbar"></div><div class="ptext" id="ptext"></div></div>
    </div>
    <div class="tabs" role="tablist" id="tabs"></div>
    <div class="filters">
      <div class="omni">
        <svg class="ic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" autocomplete="off" placeholder="חיפוש מהיר לפי דירה, שם או טלפון..." aria-label="חיפוש">
      </div>
      <div class="chips" id="bchips"></div>
    </div>
  </div>
  <div class="main" id="main">
    <aside class="drawer" id="drawer" hidden></aside>
    <section class="listwrap" id="listwrap"></section>
  </div>
</div>
<div class="pop" id="pop" hidden></div>
<div class="toast" id="toast" hidden></div>

<script>
(function(){
'use strict';
// ---------- constants ----------
const METHODS=[
  {k:'room',ic:'📞',short:'חדר',label:'שיחת טלפון לחדר'},
  {k:'mobile',ic:'📱',short:'נייד',label:'שיחת טלפון לנייד'},
  {k:'desk',ic:'👀',short:'פרונטלי',label:'הדייר אותר פרונטלית'},
  {k:'care',ic:'🧑‍⚕️',short:'מטפל',label:'דווח ע"י המטפל שהכל תקין'},
  {k:'incoming',ic:'☎️',short:'יזומה',label:'שיחה יזומה של הדייר לקבלה'},
  {k:'visit',ic:'🚪',short:'ביקור',label:'ביקור פיזי בחדר/דירה'},
  {k:'notneeded',ic:'➖',short:'לא נדרש',label:'אין צורך להתקשר - דייר אינו שוהה בדירה'},
];
const M=Object.fromEntries(METHODS.map(m=>[m.k,m]));
const NOANS=['לא ענה לטלפון בחדר','לא ענה לנייד','ביקור בחדר ואין תשובה','הדייר אינו בדירה - לברר'];
const DEPTS=['קבלה','סיעוד','עבודה סוציאלית','משק ואחזקה','הנהלה'];
const CALLCATS=['אחזקה','חשמל','אינסטלציה','ניקיון','מיזוג','אחר'];
const STAFF=['רחל (קבלה)','אורית (קבלה)','יוסי (קבלה – לילה)','מירב (אחראית משמרת)'];
const BLD={a:'א',b:'ב',c:'ג'};
const TABS=[
  {s:'pending',lbl:'טרם אותרו',sub:'ממתינים לאיתור'},
  {s:'followup',lbl:'בבירור / לא ענו',sub:'דורש מעקב'},
  {s:'located',lbl:'אותרו',sub:'ניתן לבטל בלחיצה'},
  {s:'away',lbl:'לא לאיתור',sub:'אשפוז / חופשה'},
];
const SHORT={pending:'טרם אותר/ה',followup:'בבירור',located:'אותר/ה',away:'לא לאיתור'};
const KEY='nofei-round-v1';
const HOUR=3600e3, DAY=24*HOUR;

// ---------- helpers ----------
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const hm=t=>{const d=new Date(t);return pad(d.getHours())+':'+pad(d.getMinutes())};
const dm=t=>{const d=new Date(t);return pad(d.getDate())+'/'+pad(d.getMonth()+1)};
const dmhm=t=>dm(t)+' '+hm(t);
const dayKey=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const digits=s=>String(s||'').replace(/\D/g,'');
const uid=()=>Math.random().toString(36).slice(2,9);
const HEB_DAYS=['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת'];
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

// ---------- rounds ----------
function roundsAround(now){
  const out=[];const base=new Date(now);base.setHours(0,0,0,0);
  for(let d=-1;d<=0;d++){const day=new Date(base.getTime()+d*DAY);
    for(const [type,h] of [['m',6],['e',19]]){const t=new Date(day);t.setHours(h,0,0,0);out.push({key:dayKey(day)+'-'+type,type,at:t.getTime()})}}
  return out;
}
function currentRoundKey(now){const rs=roundsAround(now).filter(r=>r.at<=now);return (rs[rs.length-1]||roundsAround(now)[0]).key}
function roundLabel(r,now){const today=dayKey(new Date(now));const d=new Date(r.at);
  const day=r.key.startsWith(today)?'היום':(dayKey(new Date(now-DAY))===r.key.slice(0,10)?'אתמול':'יום '+HEB_DAYS[d.getDay()]);
  return (r.type==='m'?'סבב בוקר 06:00':'סבב ערב 19:00')+' · '+day+' '+dm(r.at)}

// ---------- seed data ----------
function seed(){
  const R=rng(5781);const pick=a=>a[Math.floor(R()*a.length)];
  const MALE=['אברהם','יצחק','משה','דוד','שמואל','יוסף','אליהו','חיים','מנחם','יעקב','ברוך','זאב','אריה','שלמה','בנימין','גדעון','עמנואל','רפאל','נחום','אהרון','מאיר','עזרא','ישראל','מרדכי','שמעון'];
  const FEM=['שרה','רבקה','רחל','לאה','מרים','חנה','אסתר','רות','נעמי','יהודית','דבורה','שושנה','פנינה','ציפורה','אורה','תמר','בתיה','גילה','חוה','זהבה','מלכה','שולמית','אילנה','יפה','עליזה'];
  const LAST=['כהן','לוי','מזרחי','פרץ','ביטון','דהן','אברהמי','פרידמן','שפירא','רוזנברג','גולדשטיין','אוחיון','אלמוג','בן דוד','ויס','קפלן','נחמיאס','הורוביץ','טל','ברק','שטרן','זילברמן','עמר','סויסה','לנדאו','רבינוביץ','חדד','גבאי','אשכנזי','יוסופוב','קורן','הלוי','מרגלית','אלון','שרעבי','ברגר'];
  const KIDS_M=['אבי','רונן','עמית','יואב','גיל','אלון','דני','ערן'];const KIDS_F=['מיכל','ענת','שירה','דנה','אורנה','קרן','נועה','טלי'];
  const PREFIX=['050','052','053','054','058'];
  const phone=()=>pick(PREFIX)+'-'+Math.floor(1000000+R()*8999999);
  const residents=[];let num=2101;
  const layout=[['a',10,[1,2,3,4]],['b',8,[5,6,7,8]],['c',6,[9,10,11,12]]];
  for(const [b,floors,units] of layout){
    for(let f=1;f<=floors;f++)for(const u of units){
      const apt=f*100+u;const last=pick(LAST);
      const couple=R()<0.3;const occ=couple?[ 'm','f']:[R()<0.62?'f':'m'];
      for(const g of occ){
        const first=g==='m'?pick(MALE):pick(FEM);
        const r={id:'r'+num,num:num++,first,last:(couple&&g==='f'&&R()<0.15)?pick(LAST):last,g,apt,b,floor:f,
          idNum:String(Math.floor(10000000+R()*89999999)).padStart(9,'0'),mobile:R()<0.88?phone():'',ext:String(apt),
          born:1930+Math.floor(R()*20),caregiver:R()<0.18?(R()<0.5?'מטפלת צמודה':'מטפל צמוד'):'',prefs:[],contacts:[],fileStatus:'פעיל',since:2008+Math.floor(R()*16)};
        const kids=1+Math.floor(R()*2);
        for(let k=0;k<kids;k++){const kg=R()<0.5;r.contacts.push({name:(kg?pick(KIDS_M):pick(KIDS_F))+' '+r.last,rel:kg?(r.g==='m'?'בן':'בן'):'בת',phone:phone(),primary:k===0})}
        const p=R();
        if(p<0.11)r.prefs.push({text:'לא להתקשר בשבת – דייר שומר שבת',shabbat:true,from:'01/01/2020',to:'—'});
        else if(p<0.17)r.prefs.push({text:'כבד/ת שמיעה – להעדיף ביקור בדירה',from:'03/2024',to:'—'});
        else if(p<0.21)r.prefs.push({text:'לא להתקשר לפני 07:00',from:'09/2025',to:'—'});
        else if(p<0.24)r.prefs.push({text:'ירידה קוגניטיבית – לוודא מול המטפל/ת',from:'06/2025',to:'—'});
        residents.push(r);
      }
    }
  }
  const now=Date.now();
  const movements=[];
  const pickRes=()=>{let r;do{r=pick(residents)}while(movements.some(m=>m.resId===r.id));return r};
  const hosp=['שערי צדק','הדסה עין כרם','הדסה הר הצופים','הרצוג'];
  for(let i=0;i<4;i++)movements.push({id:uid(),resId:pickRes().id,type:'hospital',from:now-(1+i)*DAY-3*HOUR,to:null,note:'אשפוז ב'+pick(hosp),by:STAFF[0]});
  movements.push({id:uid(),resId:pickRes().id,type:'vacation',from:now-2*DAY,to:now+5*DAY,note:'אצל הבת בחיפה',by:STAFF[1]});
  movements.push({id:uid(),resId:pickRes().id,type:'vacation',from:now-3*DAY,to:now+2*DAY+4*HOUR,note:'נופש משפחתי בטבריה',by:STAFF[1]});
  movements.push({id:uid(),resId:pickRes().id,type:'vacation',from:now-4*DAY,to:now+35*60e3,note:'חוזר מסוף שבוע אצל הבן',by:STAFF[0]});
  movements.push({id:uid(),resId:pickRes().id,type:'vacation',from:now-6*DAY,to:now-70*60e3,note:'חזר מחופשה',by:STAFF[2]});
  movements.push({id:uid(),resId:pickRes().id,type:'hospital',from:now-9*DAY,to:now-2*HOUR,note:'שוחרר משערי צדק',by:STAFF[3]});

  const rounds={};
  const awayAt=(id,t)=>movements.some(m=>m.resId===id&&m.from<=t&&(m.to==null||m.to>t));
  const rs=roundsAround(now).filter(r=>r.at<=now);const cur=rs[rs.length-1];
  for(const r of rs){
    const marks={};const full=r!==cur;
    residents.forEach((res,i)=>{
      if(awayAt(res.id,r.at+HOUR))return;
      const x=R();
      if(full||x<0.42){
        const meth=res.caregiver&&R()<0.6?'care':pick(['room','room','room','mobile','desk','incoming']);
        marks[res.id]={status:'located',method:meth,at:r.at+Math.floor(R()*80)*60e3,by:full?pick(STAFF):STAFF[0],attempts:[]};
      }else if(x<0.47){
        marks[res.id]={status:'followup',at:r.at+Math.floor(R()*40)*60e3,by:STAFF[0],attempts:[{at:r.at+Math.floor(R()*40)*60e3,reason:pick(NOANS.slice(0,3)),by:STAFF[0]}]};
      }
    });
    rounds[r.key]={marks};
  }
  const resIdx=i=>residents[i].id;
  const notes=[
    {id:uid(),resId:resIdx(7),at:now-2*HOUR,by:'דינה (סיעוד)',dept:'סיעוד',text:'קיבלה טיפול אנטיביוטי, לשים לב שאוכלת בחדר אוכל בערב.'},
    {id:uid(),resId:resIdx(23),at:now-5*HOUR,by:STAFF[1],dept:'קבלה',text:'הבת התקשרה, תגיע מחר ב-10:00 עם רופא פרטי.'},
    {id:uid(),resId:resIdx(41),at:now-9*HOUR,by:'אבי (משק)',dept:'משק ואחזקה',text:'הוחלף ראש מקלחת. לבדוק שהלחץ תקין.'},
    {id:uid(),resId:resIdx(64),at:now-26*HOUR,by:'נורית (עו"ס)',dept:'עבודה סוציאלית',text:'שיחה עם המשפחה בנוגע למעבר לקומת סיעוד. ממתינים להחלטה.'},
  ];
  const calls=[
    {id:uid(),resId:resIdx(12),at:now-3*HOUR,by:STAFF[0],cat:'אינסטלציה',text:'נזילה מתחת לכיור במטבחון',status:'open'},
    {id:uid(),resId:resIdx(30),at:now-20*HOUR,by:STAFF[1],cat:'חשמל',text:'מנורה בחדר שינה לא נדלקת',status:'prog'},
    {id:uid(),resId:resIdx(55),at:now-30*HOUR,by:STAFF[2],cat:'מיזוג',text:'המזגן מטפטף',status:'done'},
  ];
  return {v:1,seededAt:now,residents,movements,rounds,notes,calls,staff:STAFF[0]};
}

// ---------- state ----------
let S;
try{S=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){S=null}
if(!S||S.v!==1)S=seed();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const byId=()=>Object.fromEntries(S.residents.map(r=>[r.id,r]));
let RES=byId();
const ui={view:'round',tab:'pending',q:'',b:'all',floor:'all',drawer:null,round:currentRoundKey(Date.now()),noForm:false,mvType:null,folds:{}};

function roundObj(key){if(!S.rounds[key])S.rounds[key]={marks:{}};return S.rounds[key]}
function roundRef(){return roundsAround(Date.now()).find(r=>r.key===ui.round)}
function refTime(){const r=roundRef();const now=Date.now();return (!r||r.key===currentRoundKey(now))?now:r.at+HOUR}
function activeMove(resId,t=refTime()){return S.movements.find(m=>m.resId===resId&&m.from<=t&&(m.to==null||m.to>t))}
function recentReturn(resId){const now=Date.now();return S.movements.find(m=>m.resId===resId&&m.to!=null&&m.to<=now&&now-m.to<12*HOUR)}
function statusOf(resId){
  const mk=roundObj(ui.round).marks[resId];
  if(mk&&mk.status==='located')return 'located';
  if(activeMove(resId))return 'away';
  if(mk&&mk.status==='followup')return 'followup';
  return 'pending';
}
function isShabbatNow(){const d=new Date();return d.getDay()===6||(d.getDay()===5&&d.getHours()>=16)}
function noCall(r){return r.prefs.some(p=>p.shabbat)&&isShabbatNow()}
function initials(r){return (r.first[0]||'')+(r.last[0]||'')}
function avColor(r){const hues=[188,205,160,262,22,330,120,45];return 'hsl('+hues[r.num%hues.length]+' 38% 42%)'}
function fullName(r){return r.first+' '+r.last}
function bldFloor(r){return 'בניין '+BLD[r.b]+"' · קומה "+r.floor}

// ---------- matching ----------
function matches(r){
  const q=ui.q.trim();
  if(ui.b!=='all'&&r.b!==ui.b)return false;
  if(ui.floor!=='all'&&String(r.floor)!==ui.floor)return false;
  if(!q)return true;
  return q.split(/\s+/).every(tok=>{
    const d=digits(tok);
    if(d&&d.length===tok.replace(/[-\s]/g,'').length){
      if(String(r.apt).startsWith(d))return true;
      if(String(r.num).startsWith(d))return true;
      if(d.length>=3&&(digits(r.mobile).includes(d)||r.idNum.includes(d)))return true;
      return false;
    }
    return r.first.includes(tok)||r.last.includes(tok);
  });
}

// ---------- rendering ----------
function renderNav(){
  const titles={notes:'קשר מחלקתי',calls:'קריאות שירות',moves:'כרטיסת תנועות'};
  $('#nav').innerHTML=ui.view==='round'?`<button aria-current="true" data-act="view" data-v="round">סבב</button><button data-act="navmore">עוד ▾</button>`:
    `<button class="big" data-act="view" data-v="round">→ חזרה לסבב</button>`;
  $('#roundArea').hidden=ui.view!=='round';
}
function renderStaff(){$('#staff').innerHTML=STAFF.map(s=>`<option ${s===S.staff?'selected':''}>${esc(s)}</option>`).join('')}
function renderRoundSel(){
  const now=Date.now();const rs=roundsAround(now);const cur=currentRoundKey(now);
  $('#roundSel').innerHTML=rs.slice().reverse().map(r=>`<option value="${r.key}" ${r.key===ui.round?'selected':''}>${esc(roundLabel(r,now))}${r.at>now?' (טרם התחיל)':''}</option>`).join('');
  const r=roundRef();const el=$('#rstate');
  if(r.at>now){el.textContent='ממתין לביצוע';el.className='rstate'}
  else if(r.key===cur){el.textContent='● בתהליך';el.className='rstate live'}
  else{el.textContent='סבב קודם';el.className='rstate'}
}
function counts(){const c={pending:0,followup:0,located:0,away:0};S.residents.forEach(r=>c[statusOf(r.id)]++);return c}
function renderHeader(){
  const c=counts();const total=S.residents.length;
  $('#tabs').innerHTML=TABS.map(t=>`<button class="tab ${t.s==='followup'&&c.followup?'alert':''}" role="tab" data-act="tab" data-s="${t.s}" aria-selected="${ui.tab===t.s}"><span><span class="lbl">${t.lbl}</span><span class="sub">${t.sub}</span></span><span class="cnt">${c[t.s]}</span></button>`).join('');
  const seg=(n,col)=>`<i style="width:${n/total*100}%;background:var(${col})"></i>`;
  $('#pbar').innerHTML=seg(c.located,'--ok')+seg(c.away,'--away')+seg(c.followup,'--follow');
  const done=c.located+c.away;
  $('#ptext').innerHTML=`<b class="num">${done}</b> מתוך <span class="num">${total}</span> דיירים טופלו (${Math.round(done/total*100)}%) · אותרו <b class="num">${c.located}</b> · טרם אותרו <b class="num">${c.pending+c.followup}</b>`;
  const floors=[...new Set(S.residents.filter(r=>ui.b==='all'||r.b===ui.b).map(r=>r.floor))].sort((a,b)=>a-b);
  $('#bchips').innerHTML=`<button class="chip" data-act="bld" data-b="all" aria-pressed="${ui.b==='all'}">כל הבניינים</button>`+
    Object.entries(BLD).map(([k,v])=>`<button class="chip" data-act="bld" data-b="${k}" aria-pressed="${ui.b===k}">בניין ${v}'</button>`).join('')+
    `<select id="floorSel" aria-label="קומה"><option value="all">כל הקומות</option>${floors.map(f=>`<option value="${f}" ${String(f)===ui.floor?'selected':''}>קומה ${f}</option>`).join('')}</select>`;
}
function pills(r,st){
  const dis=noCall(r);
  return `<button class="big yes" data-act="loc" data-id="${r.id}" data-m="room" ${dis?'disabled title="שומר שבת – לא להתקשר"':''}>📞 ענה בטלפון</button>`+
    `<button class="big yes" data-act="loc" data-id="${r.id}" data-m="desk">👀 ${r.g==='f'?'ראיתי אותה':'ראיתי אותו'}</button>`+
    `<button class="big no" data-act="noans" data-id="${r.id}">⚠️ ${st==='followup'?'שוב לא ענה':'לא ענה'}</button>`+
    `<button class="big more" data-act="more" data-id="${r.id}">עוד ▾</button>`;
}
function tagsFor(r){
  const t=[];
  r.prefs.forEach(p=>t.push(`<span class="tag red">${esc(p.shabbat?'שומר שבת – לא להתקשר':p.text)}</span>`));
  if(r.caregiver)t.push(`<span class="tag">${esc(r.caregiver)}</span>`);
  const rr=recentReturn(r.id);if(rr&&statusOf(r.id)!=='away')t.push(`<span class="tag vio">${rr.type==='hospital'?'חזר/ה מאשפוז':'חזר/ה מחופשה'} ${hm(rr.to)}</span>`);
  const oc=S.calls.filter(c=>c.resId===r.id&&c.status!=='done').length;if(oc)t.push(`<span class="tag amb">קריאת שירות פתוחה</span>`);
  return t.length?`<div class="tags">${t.join('')}</div>`:'';
}
function rowState(r,st){
  const mk=roundObj(ui.round).marks[r.id];
  if(st==='located')return `<div class="state">${M[mk.method]?.ic||''} <b>${esc(M[mk.method]?.label||mk.method)}</b><br><span class="num">${hm(mk.at)}</span> · ${esc(mk.by)}</div><button class="pill undo sm" data-act="undo" data-id="${r.id}">↩ ביטול</button>`;
  if(st==='away'){const m=activeMove(r.id);return `<div class="state"><b>${m.type==='hospital'?'🏥 אשפוז':'🧳 חופשה'}</b> · ${esc(m.note||'')}<br>מ-<span class="num">${dmhm(m.from)}</span>${m.to?` · חזרה צפויה <b class="num">${dmhm(m.to)}</b>`:' · ללא תאריך חזרה'}</div><button class="pill sm" data-act="endmove" data-mid="${m.id}">חזר/ה עכשיו</button>`}
  let pre='';
  if(st==='followup'&&mk){const a=mk.attempts||[];const last=a[a.length-1];pre=`<div class="state"><b class="num">${a.length} ${a.length===1?'ניסיון':'ניסיונות'}</b> · אחרון ${last?`<span class="num">${hm(last.at)}</span> – ${esc(last.reason)}`:''}</div>`}
  return pre+pills(r,st);
}
function renderList(){
  if(ui.view!=='round'){renderScreen();return}
  const rows=S.residents.filter(r=>matches(r));
  const inTab=rows.filter(r=>statusOf(r.id)===ui.tab);
  const groups=new Map();
  inTab.sort((a,b)=>a.b.localeCompare(b.b)||a.apt-b.apt).forEach(r=>{const k=r.b+r.apt;if(!groups.has(k))groups.set(k,[]);groups.get(k).push(r)});
  if(!groups.size){

// ---------- actions ----------
let toastT;
function toast(msg,undoFn){
  const t=$('#toast');t.innerHTML=`<span>${msg}</span>${undoFn?'<button id="tUndo">ביטול</button>':''}`;t.hidden=false;
  if(undoFn)$('#tUndo').onclick=()=>{undoFn();t.hidden=true};
  clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,5000);
}
function snapshot(ids){const mk=roundObj(ui.round).marks;return ids.map(id=>[id,mk[id]?JSON.parse(JSON.stringify(mk[id])):null])}
function restore(snap){const mk=roundObj(ui.round).marks;snap.forEach(([id,v])=>{if(v)mk[id]=v;else delete mk[id]});save();renderAll()}
function locate(ids,method){
  const mk=roundObj(ui.round).marks;const snap=snapshot(ids);
  ids.forEach(id=>{const prev=mk[id];mk[id]={status:'located',method,at:Date.now(),by:S.staff,attempts:prev?.attempts||[]}});
  save();renderAll();
  const names=ids.map(id=>RES[id].first).join(' ו');
  toast(`${esc(names)} – סומן אותר (${esc(M[method].label)})`,()=>restore(snap));
}
function noAnswer(id,reason){
  const mk=roundObj(ui.round).marks;const snap=snapshot([id]);const prev=mk[id];
  const attempts=(prev?.attempts||[]).concat({at:Date.now(),reason,by:S.staff});
  mk[id]={status:'followup',at:Date.now(),by:S.staff,attempts};
  save();renderAll();
  toast(`${esc(RES[id].first)} עבר/ה ל"בבירור" – ${attempts.length} ${attempts.length===1?'ניסיון':'ניסיונות'}`,()=>restore(snap));
}
let popAt=0;
function closePop(){$('#pop').hidden=true}
function openRoom(btn){
  const p=$('#pop');const apt=btn.dataset.apt;
  p.innerHTML=`<h6>כל הדירה אותרה – איך?</h6>`+['room','desk','care','visit','incoming'].map(k=>`<button data-act="locroom" data-apt="${apt}" data-m="${k}">${M[k].ic} ${M[k].label}</button>`).join('');
  placePop(btn);
}
function openNavMore(btn){
  const p=$('#pop');const openCalls=S.calls.filter(c=>c.status!=='done').length;
  p.innerHTML=`<button class="navbtn" data-act="view" data-v="notes">📝 קשר מחלקתי</button><button class="navbtn" data-act="view" data-v="calls">🔧 קריאות שירות${openCalls?` (${openCalls} פתוחות)`:''}</button><button class="navbtn" data-act="view" data-v="moves">🏥 כרטיסת תנועות (אשפוז / חופשה)</button>`;
  placePop(btn);
}
function openMore(btn,id){
  const p=$('#pop');const r=RES[id];
  p.innerHTML=`<h6>אותר – איך? (${esc(fullName(r))})</h6>`+METHODS.map(m=>{const dis=(m.k==='room'||m.k==='mobile')&&noCall(r)||(m.k==='mobile'&&!r.mobile);return `<button data-act="loc" data-id="${id}" data-m="${m.k}" ${dis?'disabled':''}>${m.ic} ${m.label}</button>`}).join('')+
    `<h6 style="margin-top:10px">לא אותר – למה?</h6>`+NOANS.map((n,i)=>`<button class="nobtn" data-act="noreason" data-id="${id}" data-i="${i}">⚠️ ${n}</button>`).join('');
  placePop(btn);
}
function placePop(btn){
  popAt=Date.now();const p=$('#pop');p.hidden=false;const b=btn.getBoundingClientRect();const pw=p.offsetWidth,ph=p.offsetHeight;
  let left=Math.min(Math.max(8,b.left),innerWidth-pw-8);let top=b.bottom+6;if(top+ph>innerHeight-8)top=Math.max(8,b.top-ph-6);
  p.style.left=left+'px';p.style.top=top+'px';
}

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');
  if(!e.target.closest('#pop')&&!(el&&['more','roommenu','navmore'].includes(el.dataset.act)))closePop();
  if(!el||el.tagName==='SELECT')return;
  const a=el.dataset.act,id=el.dataset.id;
  if(a!=='open')e.stopPropagation();
  switch(a){
    case 'view':closePop();ui.view=el.dataset.v;renderAll();$('#listwrap').scrollTop=0;break;
    case 'tab':ui.tab=el.dataset.s;renderHeader();renderList();$('#listwrap').scrollTop=0;break;
    case 'bld':ui.b=el.dataset.b;ui.floor='all';renderHeader();renderList();break;
    case 'open':if(e.target.closest('.acts')&&e.target.closest('button'))return;ui.drawer=id;ui.mvType=null;ui.folds={};renderList();renderDrawer();$('#drawer').scrollTop=0;break;
    case 'close':ui.drawer=null;renderList();renderDrawer();break;
    case 'loc':closePop();locate([id],el.dataset.m);break;
    case 'more':openMore(el,id);break;
    case 'noans':noAnswer(id,NOANS[0]);break;
    case 'noreason':closePop();noAnswer(id,NOANS[+el.dataset.i]);break;
    case 'roommenu':openRoom(el);break;
    case 'navmore':openNavMore(el);break;
    case 'locroom':{closePop();const ids=S.residents.filter(r=>(r.b+r.apt)===el.dataset.apt&&statusOf(r.id)===ui.tab&&matches(r)).map(r=>r.id);locate(ids,el.dataset.m);break}
    case 'undo':{const mk=roundObj(ui.round).marks;const snap=snapshot([id]);const prev=mk[id];if(prev?.attempts?.length)mk[id]={status:'followup',at:prev.at,by:prev.by,attempts:prev.attempts};else delete mk[id];save();renderAll();toast(`הסימון של ${esc(RES[id].first)} בוטל`,()=>restore(snap));break}
    case 'mvtype':ui.mvType=ui.mvType===el.dataset.t?null:el.dataset.t;renderDrawer();break;
    case 'mvsave':{const to=$('#mvTo').value;const toT=to?new Date(to).getTime():null;
      if(ui.mvType==='vacation'&&!toT){toast('נא לבחור מועד חזרה צפוי לחופשה');break}
      if(toT&&toT<=Date.now()){toast('מועד החזרה צריך להיות בעתיד');break}
      S.movements.push({id:uid(),resId:id,type:ui.mvType,from:Date.now(),to:toT,note:$('#mvNote').value.trim(),by:S.staff});
      ui.mvType=null;save();renderAll();toast(`${esc(RES[id].first)} הועבר/ה ל"לא לאיתור"`);break}
    case 'endmove':{const m=S.movements.find(x=>x.id===el.dataset.mid);if(m){m.to=Date.now()-1;save();renderAll();toast(`${esc(RES[m.resId].first)} חזר/ה לרשימת האיתור`)}break}
    case 'addcall':{const t=$('#callText').value.trim();if(!t){$('#callText').focus();break}S.calls.push({id:uid(),resId:id,at:Date.now(),by:S.staff,cat:$('#callCat').value,text:t,status:'open'});save();renderAll();toast('קריאת שירות נפתחה');break}
    case 'addnote':{const t=$('#noteText').value.trim();if(!t){$('#noteText').focus();break}S.notes.push({id:uid(),resId:id,at:Date.now(),by:S.staff,dept:$('#noteDept').value,text:t});save();renderAll();toast('העדכון נשמר בקשר המחלקתי');break}
    case 'copy':{const v=el.dataset.v;navigator.clipboard?.writeText(v).then(()=>toast('הועתק: '+esc(v)),()=>toast(esc(v)));break}
    case 'reset':S=seed();RES=byId();ui.drawer=null;save();renderAll();toast('נתוני ההדגמה אופסו');break;
  }
});

const q=$('#q');
q.addEventListener('input',()=>{ui.q=q.value;renderList()});
q.addEventListener('keydown',e=>{
  if(e.key==='Enter'){const hits=S.residents.filter(r=>matches(r));const inTab=hits.filter(r=>statusOf(r.id)===ui.tab);
    const pool=inTab.length?inTab:hits;
    if(!inTab.length&&hits.length){ui.tab=statusOf(hits[0].id);renderHeader();renderList()}
    if(pool.length===1||new Set(pool.map(r=>r.b+r.apt)).size===1){ui.drawer=pool[0].id;renderList();renderDrawer()}}
  if(e.key==='Escape'){q.value='';ui.q='';renderList()}
});
document.addEventListener('keydown',e=>{
  if(e.key==='/'&&document.activeElement.tagName!=='INPUT'&&document.activeElement.tagName!=='TEXTAREA'){e.preventDefault();if(ui.view!=='round'){ui.view='round';renderAll()}q.focus()}
  if(e.key==='Escape'&&document.activeElement!==q){if(!$('#pop').hidden)closePop();else if(ui.drawer){ui.drawer=null;renderList();renderDrawer()}}
});
$('#listwrap').addEventListener('scroll',()=>{if(Date.now()-popAt>250)closePop()});
document.addEventListener('toggle',e=>{const d=e.target;if(d.dataset&&d.dataset.fold)ui.folds[d.dataset.fold]=d.open},true);

function tick(){const d=new Date();$('#clock').textContent=pad(d.getHours())+':'+pad(d.getMinutes())}
let lastSig='';
setInterval(()=>{tick();
  // movements may have expired: re-render when the away set changes
  const sig=S.residents.filter(r=>activeMove(r.id)).map(r=>r.id).join();
  if(sig!==lastSig){lastSig=sig;renderHeader();if(ui.view==='round')renderList();if(ui.drawer)renderDrawer()}
},15000);

renderStaff();tick();renderAll();
lastSig=S.residents.filter(r=>activeMove(r.id)).map(r=>r.id).join();
const demo=document.createElement('div');demo.className='demo';demo.innerHTML='אב-טיפוס עם נתוני דוגמה (לא דיירים אמיתיים). השינויים נשמרים בדפדפן זה בלבד. <button data-act="reset">איפוס נתוני הדגמה</button>';
$('#app').insertBefore(demo,$('#main'));
try{q.focus({preventScroll:true})}catch(e){}
})();
</script>

</html>
