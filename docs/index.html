<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>הוד קשר – הוד ירושלים (הדגמה)</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230f6e74'/%3E%3C/svg%3E">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;500;600;700;800&display=swap">
<!--
  DEMO ONLY – all data is fictitious, generated by the seed below and kept in localStorage ("hod_demo_v1").
  Never add real residents' names, ID numbers, phones or medical data to this file.
  Spec: demo-spec.md (this demo) and hod-app-spec.md (production requirements, out of scope here).
-->
<style>
:root{
  --bg:#f3f5f7; --surface:#ffffff; --surface-2:#eef1f4; --line:#dde3e9; --line-2:#c9d2da; --fg:#18242e; --muted:#5a6875;
  --accent:#0f6e74; --accent-ink:#ffffff; --accent-soft:#dff0f0;
  --pending:#2f5d8a; --pending-soft:#e3ecf6;
  --warn:#9a4a0b; --warn-soft:#fdebd9;
  --ok:#1d7a4c; --ok-soft:#dcf1e5;
  --away:#6a4c9c; --away-soft:#ece6f6;
  --danger:#b4232c; --danger-soft:#fbe3e4;
  --banner:#5b3a00; --banner-bg:#ffe9a8; --on-solid:#ffffff;
  --cat-admin:#1f5fb4; --cat-admin-soft:#e2ecf9; --cat-medical:#b4232c; --cat-medical-soft:#fbe3e4;
  --cat-social:#1d7a4c; --cat-social-soft:#dcf1e5; --cat-marketing:#a94f00; --cat-marketing-soft:#fdebd9;
  --shadow:0 1px 2px rgba(16,36,48,.06),0 6px 20px rgba(16,36,48,.10);
  --font:"Assistant","Segoe UI","Arial Hebrew",Arial,sans-serif;
  --r:10px; --nav-w:228px; --panel-w:460px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f161c; --surface:#16212a; --surface-2:#1c2a35; --line:#2a3a47; --line-2:#3a4c5a; --fg:#e6edf2; --muted:#9aaab8;
  --accent:#4fb8b9; --accent-ink:#06282a; --accent-soft:#163a3d;
  --pending:#8db6e2; --pending-soft:#1b2d42; --warn:#f0a463; --warn-soft:#3a2516;
  --ok:#6fd09d; --ok-soft:#143425; --away:#b9a2e6; --away-soft:#2a2340; --danger:#f2858b; --danger-soft:#3d1b1f;
  --banner:#ffe3a0; --banner-bg:#4a3608; --on-solid:#0b1a14;
  --cat-admin:#8db6ee; --cat-admin-soft:#1a2c45; --cat-medical:#f2858b; --cat-medical-soft:#3d1b1f;
  --cat-social:#6fd09d; --cat-social-soft:#143425; --cat-marketing:#f5a560; --cat-marketing-soft:#3a2516;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f161c; --surface:#16212a; --surface-2:#1c2a35; --line:#2a3a47; --line-2:#3a4c5a; --fg:#e6edf2; --muted:#9aaab8;
  --accent:#4fb8b9; --accent-ink:#06282a; --accent-soft:#163a3d;
  --pending:#8db6e2; --pending-soft:#1b2d42; --warn:#f0a463; --warn-soft:#3a2516;
  --ok:#6fd09d; --ok-soft:#143425; --away:#b9a2e6; --away-soft:#2a2340; --danger:#f2858b; --danger-soft:#3d1b1f;
  --banner:#ffe3a0; --banner-bg:#4a3608; --on-solid:#0b1a14;
  --cat-admin:#8db6ee; --cat-admin-soft:#1a2c45; --cat-medical:#f2858b; --cat-medical-soft:#3d1b1f;
  --cat-social:#6fd09d; --cat-social-soft:#143425; --cat-marketing:#f5a560; --cat-marketing-soft:#3a2516;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.35); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg.i{width:18px;height:18px;flex:none;vertical-align:middle}

/* ---------- shell ---------- */
#app{min-height:100%;display:flex;flex-direction:column}
.demo-strip{position:sticky;top:0;z-index:30;background:var(--banner-bg);color:var(--banner);text-align:center;font-weight:700;font-size:14px;padding:4px 12px;padding-top:max(4px,env(safe-area-inset-top,0px))}
.top{position:sticky;top:var(--strip-h,29px);z-index:25;background:var(--surface);border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding:8px 16px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit;min-width:0}
.brand .logo{width:36px;height:36px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.brand b{font-size:18px;font-weight:800;letter-spacing:-.01em;white-space:nowrap}
.gsearch{flex:1 1 280px;max-width:520px;position:relative;min-width:0}
.gsearch input[type=search]{width:100%;height:42px;border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:0 40px 0 44px;font-size:16px}
.gsearch input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.gsearch .i{position:absolute;right:12px;top:12px;color:var(--muted);pointer-events:none}
.gsearch kbd{position:absolute;left:10px;top:10px;font-size:12px;border:1px solid var(--line);border-radius:5px;padding:1px 7px;color:var(--muted);background:var(--surface)}
.gresults{position:absolute;inset-inline:0;top:46px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:6px;z-index:40;max-height:60vh;overflow:auto}
.gresults button{display:flex;width:100%;gap:10px;align-items:center;border:0;background:none;text-align:start;padding:8px 10px;border-radius:8px;min-height:44px}
.gresults button[aria-selected="true"],.gresults button:hover{background:var(--accent-soft)}
.gresults .empty-s{padding:12px;color:var(--muted)}
.top .sp{flex:1}
.clock{font-weight:700;font-size:17px;white-space:nowrap}
.me{display:flex;align-items:center;gap:8px;font-size:14px;white-space:nowrap}
.me b{font-size:15px}
.me .role{color:var(--muted)}
.shell{flex:1;display:grid;grid-template-columns:var(--nav-w) minmax(0,1fr);min-height:0}
.nav{border-inline-end:1px solid var(--line);background:var(--surface);padding:10px 8px;display:flex;flex-direction:column;gap:2px;position:sticky;top:var(--top-h,87px);height:calc(100vh - var(--top-h,87px));overflow:auto}
.nav a{display:flex;align-items:center;gap:10px;white-space:nowrap;padding:0 12px;min-height:44px;border-radius:10px;text-decoration:none;color:var(--fg);font-weight:600;font-size:16px}
.nav a:hover{background:var(--surface-2)}
.nav a[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.nav a .i{color:var(--muted)}
.nav a[aria-current="page"] .i{color:var(--accent)}
.nav .badge{margin-inline-start:auto}
.nav .foot{margin-top:auto;padding:10px 12px 4px;font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:6px}
.nav .foot button{border:0;background:none;color:var(--accent);padding:0;text-align:start;font-size:13px}
.badge{min-width:22px;height:22px;padding:0 7px;border-radius:999px;background:var(--danger);color:var(--on-solid);font-size:12.5px;font-weight:700;display:inline-grid;place-items:center;font-variant-numeric:tabular-nums}
.badge.soft{background:var(--surface-2);color:var(--muted)}
main#main{min-width:0;padding:16px 20px 60px}
body.panel-open main#main{padding-left:calc(var(--panel-w) + 20px)}

/* ---------- generic ---------- */
.ph{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;margin-bottom:12px}
.ph h1{margin:0;font-size:25px;font-weight:800;letter-spacing:-.01em}
.ph .sub{color:var(--muted);font-size:15px}
.ph .sp{flex:1}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.card.pad{padding:14px 16px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:0 16px;border-radius:10px;border:1px solid var(--line-2);background:var(--surface);font-weight:700;font-size:15px;white-space:nowrap;text-decoration:none;color:var(--fg)}
.btn:hover{background:var(--surface-2)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:var(--on-solid)}
.btn.danger{background:var(--danger);border-color:var(--danger);color:var(--on-solid)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--accent)}
.btn.ghost:hover{background:var(--accent-soft)}
.btn.sm{min-height:34px;padding:0 10px;font-size:14px;border-radius:8px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.linkbtn{border:0;background:none;padding:0;color:var(--accent);font-weight:700;text-align:start;cursor:pointer}
.linkbtn:hover{text-decoration:underline}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:700;padding:2px 9px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.red{background:var(--danger-soft);color:var(--danger)}
.chip.vio{background:var(--away-soft);color:var(--away)}
.chip.blue{background:var(--pending-soft);color:var(--pending)}
.chip.acc{background:var(--accent-soft);color:var(--accent)}
.filters{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;margin-bottom:12px}
.filters .q{flex:1 1 240px;min-width:0;position:relative}
.filters .q input{width:100%;padding-right:38px}
.filters .q .i{position:absolute;right:11px;top:11px;color:var(--muted);pointer-events:none}
input[data-date]{width:9.5em;direction:ltr;text-align:right}
input[data-time]{width:5.2em;direction:ltr;text-align:right}
.dt{display:flex;gap:6px}
.fld .dt input{width:auto}
input[type=text],input[type=search],input[type=tel],input[type=email],input[type=number],input[type=date],input[type=datetime-local],input[type=time],input[type=password],select,textarea{min-height:40px;border:1px solid var(--line-2);background:var(--surface);border-radius:9px;padding:6px 10px;font-size:15.5px;max-width:100%}
textarea{min-height:76px;resize:vertical;width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
input[type=checkbox],input[type=radio]{width:20px;height:20px;accent-color:var(--accent);vertical-align:middle;margin:0}
label.cb{display:inline-flex;align-items:center;gap:8px;min-height:40px;cursor:pointer;font-weight:600}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button,.seg a{border:0;background:none;min-height:40px;padding:0 14px;font-weight:700;font-size:15px;color:var(--muted);display:inline-flex;align-items:center;gap:6px;text-decoration:none;border-inline-start:1px solid var(--line)}
.seg > :first-child{border-inline-start:0}
.seg [aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.tbl{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:auto}
table{border-collapse:collapse;width:100%;font-size:15px}
th{font-size:13px;color:var(--muted);font-weight:700;text-align:start;padding:8px 10px;background:var(--surface-2);white-space:nowrap;position:sticky;top:0}
td{padding:6px 10px;border-top:1px solid var(--line);vertical-align:middle}
tr.click{cursor:pointer}
tr.click:hover td{background:color-mix(in srgb,var(--accent) 5%,var(--surface))}
tr.sel td{background:var(--accent-soft)}
tr.overdue td{background:var(--danger-soft)}
tr.overdue td:first-child{box-shadow:inset -4px 0 0 var(--danger)}
tr.superseded td{opacity:.55}
tr.flash td{background:var(--accent-soft)!important}
td.n,th.n{white-space:nowrap;font-variant-numeric:tabular-nums}
.empty{padding:36px 16px;text-align:center;color:var(--muted)}
.empty b{display:block;font-size:18px;color:var(--fg);margin-bottom:4px}
.note-inline{background:var(--warn-soft);color:var(--warn);border-radius:9px;padding:8px 12px;font-weight:600;font-size:14.5px}
.note-inline.red{background:var(--danger-soft);color:var(--danger)}
.note-inline.ok{background:var(--ok-soft);color:var(--ok)}
.note-inline.info{background:var(--accent-soft);color:var(--accent)}
.err{color:var(--danger);font-size:13.5px;font-weight:600;min-height:0}
.err:empty{display:none}
.inv{border-color:var(--danger)!important;box-shadow:0 0 0 2px var(--danger-soft)!important}
.av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:14px;color:#fff;flex:none}
.confirm{display:inline-flex;flex-wrap:wrap;align-items:center;gap:8px;background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:6px 10px;font-weight:700}
.confirm input{min-width:180px}

/* forms */
.form{display:flex;flex-direction:column;gap:12px}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld > span:first-child{font-size:14px;font-weight:700;color:var(--muted)}
.fld.req > span:first-child::after{content:" *";color:var(--danger)}
.fld input:not([type=checkbox]),.fld select,.fld textarea{width:100%}
.frow{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.hint{font-size:13px;color:var(--muted)}
fieldset{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:0;display:flex;flex-direction:column;gap:10px}
legend{font-weight:800;font-size:14px;padding:0 6px}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:6px 16px;font-size:15px;margin:0}
.kv dt{color:var(--muted);font-weight:600}
.kv dd{margin:0;font-weight:600;min-width:0}
details.more{border:1px solid var(--line);border-radius:10px;padding:0 12px}
details.more>summary{min-height:44px;display:flex;align-items:center;font-weight:800;cursor:pointer}
details.more[open]{padding-bottom:12px}
.hist{display:flex;flex-direction:column;gap:6px;font-size:14px;margin:0;padding:0;list-style:none}
.hist li{background:var(--surface-2);border-radius:8px;padding:6px 10px}
.hist small{color:var(--muted)}

/* side panel (non-blocking, page stays usable) */
#panel{position:fixed;left:0;top:var(--top-h,87px);bottom:0;width:var(--panel-w);max-width:100vw;background:var(--surface);border-inline-start:1px solid var(--line);box-shadow:var(--shadow);z-index:20;display:flex;flex-direction:column}
.p-h{display:flex;align-items:flex-start;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line)}
.p-h h2{margin:0;font-size:20px;font-weight:800;line-height:1.2}
.p-h .meta{color:var(--muted);font-size:14px;margin-top:2px}
.p-h .x{margin-inline-start:auto;flex:none;width:40px;height:40px;border-radius:10px;border:0;background:var(--surface-2);display:grid;place-items:center}
.p-b{flex:1;overflow:auto;padding:14px 16px 30px;display:flex;flex-direction:column;gap:14px}
.p-sec h3{margin:0 0 6px;font-size:13px;letter-spacing:.03em;color:var(--muted);font-weight:800;display:flex;justify-content:space-between;align-items:center;gap:8px}

/* ---------- rounds ---------- */
.rhead{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;margin-bottom:10px}
.rhead select.rsel{font-size:19px;font-weight:800;min-height:44px}
.prog{flex:1 1 260px;display:flex;flex-direction:column;gap:5px;min-width:200px}
.pbar{height:12px;border-radius:999px;background:var(--surface-2);overflow:hidden;display:flex}
.pbar i{display:block;height:100%;background:var(--ok);transition:width .25s}
.pbar i.x{background:var(--away)}
.ptext{font-size:15px}
.ptext b{font-size:19px}
.rtabs{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.rtab{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:0 14px;min-height:48px;font-weight:800;font-size:16.5px;color:var(--fg)}
.rtab .c{font-size:22px;font-variant-numeric:tabular-nums}
.rtab[data-s="pending"] .c{color:var(--pending)}
.rtab[data-s="located"] .c{color:var(--ok)}
.rtab[data-s="excluded"] .c{color:var(--away)}
.rtab[aria-selected="true"]{box-shadow:inset 0 0 0 2px var(--accent);background:var(--accent-soft)}
.rlist{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);container-type:inline-size}
.rrow{display:grid;grid-template-columns:96px minmax(70px,1fr) minmax(70px,1fr) 90px 132px 400px;align-items:center;gap:0 10px;padding:2px 12px;min-height:44px;border-top:1px solid var(--line)}
.rrow:first-child{border-top:0}
.rrow.hdr{min-height:34px;background:var(--surface-2);font-size:13px;color:var(--muted);font-weight:800;position:sticky;top:var(--top-h,87px);z-index:2}
.rrow:not(.hdr):hover{background:color-mix(in srgb,var(--accent) 4%,var(--surface))}
.rrow.flash{animation:flash 1s}
@keyframes flash{from{background:var(--ok-soft)}}
.rrow .apt{font-weight:800;font-size:17px;font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:6px}
.rrow.hdr{border-radius:var(--r) var(--r) 0 0}
@container (max-width:980px){.rrow,.rrow.hdr{grid-template-columns:96px minmax(70px,1fr) minmax(70px,1fr) 132px 400px}.rrow .loc{display:none}}
@container (max-width:840px){.rrow{grid-template-columns:96px minmax(0,1fr) minmax(0,1fr) auto;padding-block:6px}.rrow.hdr{display:none}.rrow .outs,.rrow .done-info{grid-column:1/-1;justify-content:flex-start}.rrow .tel span{display:none}}
.rrow .ln,.rrow .fn{font-weight:700;font-size:16.5px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rrow .ln .linkbtn,.rrow .fn .linkbtn{color:var(--fg)}
.rrow .loc{color:var(--muted);font-size:14px;white-space:nowrap}
.rrow .tel{font-size:14.5px;white-space:nowrap;font-variant-numeric:tabular-nums;color:var(--fg);text-decoration:none;display:inline-flex;align-items:center;gap:4px;min-height:40px}
.rrow .tel:hover{color:var(--accent)}
.rrow .outs{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end;align-items:center;padding-block:2px}
.ob{min-height:40px;padding:0 12px;border-radius:10px;border:1.5px solid color-mix(in srgb,var(--ok) 45%,var(--line));background:var(--surface);color:var(--ok);font-weight:800;font-size:15px;white-space:nowrap}
@container (min-width:841px){.rrow:not(.hdr){min-height:36px;padding-block:0}.rrow .tel{min-height:30px}.rrow .outs{padding-block:0}.rrow .ob{min-height:30px}}
.ob:hover{background:var(--ok);color:var(--on-solid);border-color:var(--ok)}
.ob.visit{border-color:color-mix(in srgb,var(--pending) 45%,var(--line));color:var(--pending)}
.ob.visit:hover,.ob.visit[aria-expanded="true"]{background:var(--pending);color:var(--on-solid);border-color:var(--pending)}
.ob.sub{border-style:dashed}
.ob.apt-t{border-color:var(--line-2);color:var(--muted);font-size:13.5px;padding:0 7px;display:inline-flex;align-items:center;gap:3px}
.ob.apt-t[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.ob.ev{border-color:transparent;background:transparent;color:var(--muted);padding:0 8px}
.ob.ev:hover{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.done-info{font-size:14.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;justify-content:flex-end}
.done-info b{color:var(--ok)}
/* whole-apartment mode: every row of that apartment is tinted, mates say they're included */
.rrow.apt-on,.rrow.apt-on:not(.hdr):hover{background:var(--accent-soft);box-shadow:inset -4px 0 0 var(--accent)}
.apt-inc{display:inline-flex;align-items:center;gap:6px;color:var(--accent);font-weight:700;font-size:14.5px;min-height:30px}

.rother{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;justify-content:space-between;margin-bottom:10px}
/* narrow list (phone / narrow window): the outcome buttons share one line, the alert button stays on it */
@container (max-width:840px){
  .rrow .outs{flex-wrap:nowrap;gap:6px;padding-top:4px}
  .rrow .ob{flex:1 1 0;min-width:0;min-height:44px;padding:4px 6px;white-space:normal;line-height:1.15;font-size:14.5px}
  .rrow .ob.ev,.rrow .ob.visit.x{flex:0 0 44px;padding:0}
  .rrow .ob.apt-t{flex:none;min-height:44px;min-width:44px;justify-content:center}
  .rrow .tel{min-height:44px;min-width:44px;justify-content:center}
}
@media (max-width:700px){
  /* phone: 2 rows – round + status / progress + icon actions */
  .rhead{gap:8px 10px}
  .rhead > div:first-child{flex:1 1 220px;min-width:0}
  .rhead select.rsel{width:100%;font-size:17px}
  .rhead .prog{flex:1 1 180px;min-width:0}
  .rhead .actions{margin-inline-start:auto}
  .rhead .actions{flex-wrap:nowrap;gap:6px}
  .rhead .actions .btn{min-height:44px;min-width:44px;padding:0 10px;font-size:14px}
  .rhead .actions .lbl{display:none}
  .rtabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
  .rtab{flex-direction:column;justify-content:center;gap:0;padding:4px;min-height:54px;font-size:14.5px;line-height:1.2;text-align:center}
  .rtab .c{order:-1;font-size:22px;line-height:1.1}
}
.rnote{margin-top:14px;display:grid;grid-template-columns:1fr auto;gap:10px;align-items:start}
.legend-print{display:none}

/* ---------- residents / file ---------- */
.fhead{display:flex;flex-wrap:wrap;gap:12px 18px;align-items:center;padding:14px 16px}
.fhead .av{width:64px;height:64px;font-size:23px;border-radius:16px}
.fhead h1{margin:0;font-size:24px;font-weight:800}
.fhead .meta{color:var(--muted);font-size:15px;display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:2px}
.fhead .badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.ftabs{display:flex;gap:2px;overflow-x:auto;border-top:1px solid var(--line);padding:0 8px}
.ftabs a{display:inline-flex;align-items:center;min-height:46px;padding:0 14px;font-weight:700;color:var(--muted);text-decoration:none;border-bottom:3px solid transparent;white-space:nowrap}
.ftabs a[aria-current="page"]{color:var(--accent);border-bottom-color:var(--accent)}
.fbody{padding:16px}
.dirty-bar{position:sticky;top:var(--top-h,87px);z-index:5;margin-bottom:10px}
.contact-row{display:grid;grid-template-columns:1.2fr 1fr 1fr 1.2fr auto auto auto auto;gap:8px;align-items:center}
.swbox{display:flex;align-items:center;gap:14px;background:var(--accent-soft);border-radius:12px;padding:12px 16px;margin-bottom:14px}
.swbox .lbl{font-size:13.5px;font-weight:800;color:var(--accent)}
.swbox .nm{font-size:22px;font-weight:800}

/* ---------- home tiles / categories ---------- */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:14px}
.tile{display:flex;flex-direction:column;gap:10px;min-height:170px;padding:18px 20px;border-radius:16px;background:var(--surface);border:1px solid var(--line);border-top:8px solid var(--c);text-decoration:none;color:var(--fg);box-shadow:var(--shadow)}
.tile:hover{background:var(--cs)}
.tile .ti{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;background:var(--cs);color:var(--c)}
.tile .ti svg{width:28px;height:28px}
.tile b{font-size:26px;font-weight:800;color:var(--c)}
.tile span.d{color:var(--muted);font-size:15px}
.cat-admin{--c:var(--cat-admin);--cs:var(--cat-admin-soft)}
.cat-medical{--c:var(--cat-medical);--cs:var(--cat-medical-soft)}
.cat-social{--c:var(--cat-social);--cs:var(--cat-social-soft)}
.cat-marketing{--c:var(--cat-marketing);--cs:var(--cat-marketing-soft)}
.cat-strip{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;background:var(--cs);border-inline-start:8px solid var(--c);border-radius:12px;padding:10px 16px;margin-bottom:12px}
.cat-strip h1{margin:0;font-size:24px;font-weight:800;color:var(--c)}
.cat-strip .sp{flex:1}
.cat-strip a.back{font-weight:700;color:var(--c)}

/* ---------- medical file (תיק רפואי) ---------- */
.mhead{display:flex;flex-wrap:wrap;gap:12px 18px;align-items:flex-start;padding:14px 16px;border-top:6px solid var(--cat-medical)}
.mhead .av{width:72px;height:72px;font-size:25px;border-radius:16px}
.mhead h2{margin:0;font-size:23px;font-weight:800}
.mhead dl{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:4px 18px;margin:6px 0 0;font-size:14.5px}
.mhead dl div{display:flex;gap:6px;min-width:0}
.mhead dt{color:var(--muted);font-weight:600;white-space:nowrap}
.mhead dd{margin:0;font-weight:700;min-width:0}
.mfile{display:grid;grid-template-columns:230px minmax(0,1fr);gap:12px;margin-top:12px;align-items:start}
.mmenu{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:6px;display:flex;flex-direction:column;gap:1px;position:sticky;top:calc(var(--top-h,87px) + 8px)}
.mmenu a{display:flex;align-items:center;gap:9px;min-height:38px;padding:0 10px;border-radius:8px;text-decoration:none;color:var(--fg);font-weight:600;font-size:15px;white-space:nowrap}
.mmenu a .i{color:var(--muted)}
.mmenu a:hover{background:var(--surface-2)}
.mmenu a[aria-current="page"]{background:var(--cat-medical-soft);color:var(--cat-medical);box-shadow:inset -4px 0 0 var(--cat-medical)}
.mmenu a[aria-current="page"] .i{color:var(--cat-medical)}
.mcontent{padding:14px 16px;min-width:0}
.msec-h{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin-bottom:12px}
.msec-h h2{margin:0;font-size:21px;font-weight:800}
.msec-h .sp{flex:1}
tr.stopped td{opacity:.55}
@media (max-width:860px){
  .mfile{grid-template-columns:minmax(0,1fr)}
  .mmenu{position:static;flex-direction:row;overflow-x:auto}
  .mmenu a{flex:none}
}

/* ---------- feeds ---------- */
.feed{display:flex;flex-direction:column;gap:8px}
.ncard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px;display:flex;flex-direction:column;gap:6px}
.ncard.unread{border-color:var(--accent);box-shadow:inset -4px 0 0 var(--accent)}
.ncard.unread .txt{font-weight:800}
.ncard .top-l{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:14px;color:var(--muted)}
.ncard .txt{font-size:16px;white-space:pre-wrap}
.ncard .foot-l{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:14px;color:var(--muted)}
.summary{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 16px;margin-bottom:12px}
.summary h2{margin:0 0 8px;font-size:17px;font-weight:800;display:flex;align-items:center;gap:10px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.stat{background:var(--surface-2);border-radius:10px;padding:8px 12px}
.stat b{display:block;font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.stat span{font-size:13.5px;color:var(--muted);font-weight:600}
.stat.red b{color:var(--danger)}

/* meds */
.floor-h{font-weight:800;font-size:15px;color:var(--muted);margin:14px 0 6px}
.mres{display:grid;grid-template-columns:200px 1fr;gap:10px;align-items:start;padding:8px 12px;border-top:1px solid var(--line)}
.mres:first-child{border-top:0}
.mres.away{opacity:.55}
.dose{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:3px 0}
.dose .dn{font-weight:700;min-width:210px;flex:1}
.dose .dn small{color:var(--muted);font-weight:600}
.prn{border-top:1px dashed var(--line);margin-top:4px;padding-top:6px}
.prn .hint{white-space:nowrap}

/* bars (reports) */
.bars{display:flex;flex-direction:column;gap:6px}
.bar{display:grid;grid-template-columns:170px 1fr 40px;gap:8px;align-items:center;font-size:14.5px}
.bar .t{height:18px;background:var(--surface-2);border-radius:5px;overflow:hidden}
.bar .t i{display:block;height:100%;background:var(--accent);border-radius:5px}

/* login */
.login{max-width:820px;margin:28px auto;padding:0 16px;width:100%}
.login h1{font-size:28px;font-weight:800;margin:0 0 4px;display:flex;align-items:center;gap:12px}
.ucards{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;margin:16px 0}
.ucard{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;text-align:start;display:flex;gap:10px;align-items:center;min-height:64px}
.ucard:hover{border-color:var(--accent)}
.ucard[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.ucard b{display:block;font-size:16.5px}
.ucard small{color:var(--muted);font-size:13.5px}

.toast.has-act{display:flex;align-items:center;justify-content:space-between;gap:14px;padding-block:6px;width:max-content;min-width:min(360px,calc(100% - 32px))}
.toast-act{border:1.5px solid var(--bg);background:transparent;color:var(--bg);border-radius:9px;min-height:44px;padding:0 16px;font-weight:800;font-size:15px;flex:none}
.toast-act:hover{background:var(--bg);color:var(--fg)}
.toast{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);border-radius:12px;padding:10px 16px;box-shadow:var(--shadow);z-index:80;font-size:15px;font-weight:600;max-width:calc(100% - 32px)}
.kbdhelp{font-size:12.5px;color:var(--muted)}
.kbdhelp kbd{border:1px solid var(--line);border-radius:4px;padding:0 5px;background:var(--surface)}
.print-only{display:none}

/* modal (second signer): blocks the page, the context underneath stays */
#modal{position:fixed;inset:0;z-index:70;display:grid;place-items:center;padding:16px}
#modal .modal-back{position:absolute;inset:0;background:rgba(10,20,28,.5)}
#modal .modal{position:relative;background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);width:min(460px,100%);max-height:90vh;overflow:auto;padding:18px 20px;display:flex;flex-direction:column;gap:12px}
#modal h2{margin:0;font-size:20px;font-weight:800;display:flex;align-items:center;gap:8px}

/* ---------- tablet & phone ---------- */
@media (max-width:1180px){
  :root{--nav-w:76px;--panel-w:420px}
  .nav a{flex-direction:column;justify-content:center;gap:2px;padding:6px 4px;font-size:12px;line-height:1.15;text-align:center;min-height:58px;position:relative;white-space:normal}
  .nav a .badge{position:absolute;top:4px;left:6px;min-width:18px;height:18px;font-size:11px;padding:0 5px}
  .nav .foot{display:none}
  body.panel-open main#main{padding-left:20px}
}
@media (max-width:860px){
  .contact-row{grid-template-columns:1fr 1fr}
  .mres{grid-template-columns:1fr}
}
@media (max-width:700px){
  .demo-strip{font-size:13px}
  .top{top:0;position:relative}
  /* phone header in 3 rows instead of 4: name / search + report / clock + user */
  .top{gap:8px 10px}
  .top .brand{flex:1 1 100%}
  .top .gsearch{order:1;flex:1 1 190px}
  .top > .btn[data-act="new-event"]{order:2}
  .top .clock{order:3;font-size:15.5px}
  .top .me{order:4;margin-inline-start:auto}
  .top .me > svg,.top .sp,.top .gsearch kbd{display:none}
  .top .gsearch input{padding-left:12px}
  .shell{grid-template-columns:minmax(0,1fr)}
  .nav{position:sticky;top:var(--strip-h,27px);z-index:15;height:auto;flex-direction:row;overflow-x:auto;border-inline-end:0;border-bottom:1px solid var(--line);padding:4px}
  .nav a{min-width:68px;flex:none}
  #panel{top:var(--strip-h,27px);width:100vw;z-index:40}
  .rrow.hdr{top:27px}
  main#main{padding:12px 16px 60px}
  .brand b{font-size:16px}
  .me .role{display:none}
  .dose .dn{min-width:0;flex-basis:100%}
  .bar{grid-template-columns:110px 1fr 34px}
}

/* ---------- print ---------- */
@media print{
  @page{margin:12mm}
  body{background:#fff;color:#000;font-size:12pt}
  .top,.nav,#panel,.toast,.no-print,.filters,.rtabs,.ftabs{display:none!important}
  .demo-strip{position:static;background:#fff;color:#000;border:1px solid #000}
  .shell{display:block}
  main#main{padding:0!important}
  .print-only{display:block}
  .screen-only{display:none!important}
  .card,.tbl,.rlist,.summary,.ncard{border-color:#999;box-shadow:none}
  table{font-size:10.5pt}
  th{background:#eee;color:#000;position:static}
  body.print-summary main#main > :not(.summary-wrap){display:none!important}
  body.print-panel #app{display:none!important}
  body.print-panel #panel{display:flex!important;position:static;width:auto;box-shadow:none;border:0}
  body.print-panel #panel .p-b{overflow:visible}
  body.print-panel #panel button,body.print-panel #panel form{display:none!important}
}

<body>
<div class="demo-strip" role="note">גרסת הדגמה – נתונים פיקטיביים בלבד</div>
<div id="app"></div>
<aside id="panel" hidden aria-label="חלונית צד"></aside>
<div id="modal" hidden></div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<script>
'use strict';
/* ================================================================
   Core: helpers, time (Asia/Jerusalem), constants, storage, seed,
   permissions, router and rendering.
   ================================================================ */
const STORE_KEY = 'hod_demo_v1', SESSION_KEY = 'hod_demo_session', SCHEMA_VERSION = 14;
const IDLE_MS = 15 * 60 * 1000;
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = n => String(n).padStart(2, '0');
const byId = (arr, id) => arr.find(x => x.id === id);
const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const sum = a => a.reduce((x, y) => x + y, 0);
const median = a => { if (!a.length) return null; const s = [...a].sort((x, y) => x - y), m = s.length >> 1; return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; };
const avg = a => a.length ? sum(a) / a.length : null;
const norm = s => String(s ?? '').toLowerCase().replace(/[\s\-'"״׳.]/g, '');

/* ---------- time: everything is shown in Asia/Jerusalem ---------- */
const TZ = 'Asia/Jerusalem';
const _dtf = new Intl.DateTimeFormat('en-GB', { timeZone: TZ, year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit', hourCycle: 'h23' });
function jp(d) { const o = {}; for (const p of _dtf.formatToParts(d)) o[p.type] = p.value; return { y: +o.year, m: +o.month, d: +o.day, H: +o.hour % 24, M: +o.minute, S: +o.second }; }
function offMin(d) { const p = jp(d); return Math.round((Date.UTC(p.y, p.m - 1, p.d, p.H, p.M, p.S) - Math.floor(d.getTime() / 1000) * 1000) / 60000); }
function iso(d = new Date()) { d = new Date(d); const p = jp(d), o = offMin(d), a = Math.abs(o); return `${p.y}-${pad(p.m)}-${pad(p.d)}T${pad(p.H)}:${pad(p.M)}:${pad(p.S)}${o >= 0 ? '+' : '-'}${pad(a / 60 | 0)}:${pad(a % 60)}`; }
const nowIso = () => iso(new Date());
const ago = min => iso(new Date(Date.now() - min * 60000));
function dkey(v) { const p = jp(new Date(v)); return `${p.y}-${pad(p.m)}-${pad(p.d)}`; }
const today = () => dkey(Date.now());
function addDays(dk, n) { const [y, m, d] = dk.split('-').map(Number); return new Date(Date.UTC(y, m - 1, d + n)).toISOString().slice(0, 10); }
function fD(v) { if (!v) return ''; if (/^\d{4}-\d\d-\d\d$/.test(v)) { const [y, m, d] = v.split('-'); return `${d}/${m}/${y}`; } const p = jp(new Date(v)); return `${pad(p.d)}/${pad(p.m)}/${p.y}`; }
function fT(v) { if (!v) return ''; const p = jp(new Date(v)); return `${pad(p.H)}:${pad(p.M)}`; }
const fDT = v => v ? `${fD(v)} ${fT(v)}` : '';
function wallToIso(w) { // "YYYY-MM-DDTHH:MM" in Jerusalem → ISO with offset
  if (!w) return null; const [dp, tp = '00:00'] = w.split('T'); const [y, m, d] = dp.split('-').map(Number); const [H, M] = tp.split(':').map(Number);
  const asUtc = Date.UTC(y, m - 1, d, H, M); let o = offMin(new Date(asUtc - 120 * 60000)); o = offMin(new Date(asUtc - o * 60000));
  return iso(new Date(asUtc - o * 60000));
}
function isoToWall(v) { if (!v) return ''; const p = jp(new Date(v)); return `${p.y}-${pad(p.m)}-${pad(p.d)}T${pad(p.H)}:${pad(p.M)}`; }
const at = (dk, hm) => wallToIso(`${dk}T${hm}`);
const minOfDay = (d = new Date()) => { const p = jp(d); return p.H * 60 + p.M; };
const hm2min = s => { const [a, b] = String(s).split(':').map(Number); return a * 60 + (b || 0); };
function durTxt(ms) { if (ms == null || isNaN(ms)) return '—'; const neg = ms < 0; ms = Math.abs(ms); const h = Math.floor(ms / 3.6e6), m = Math.floor(ms % 3.6e6 / 6e4); return (neg ? '-' : '') + `${h}:${pad(m)}`; }
function hoursTxt(h) { if (h == null) return '—'; return h < 1 ? `${Math.round(h * 60)} ד׳` : `${h.toFixed(1)} ש׳`; }
function ageOf(bd) { const t = today(); let a = +t.slice(0, 4) - +bd.slice(0, 4); if (t.slice(5) < bd.slice(5)) a--; return a; }
const DOW = ['ראשון', 'שני', 'שלישי', 'רביעי', 'חמישי', 'שישי', 'שבת'];
const dow = dk => DOW[new Date(dk + 'T12:00:00Z').getUTCDay()];

/* ---------- constants ---------- */
const ROLES = { reception: 'קבלה', shift_manager: 'אחראי/ת משמרת', nurse: 'אחות / אח', social_worker: 'עו״ס', maintenance: 'אחזקה', manager: 'מנהלת', admin: 'מנהל מערכת' };
const RES_STATUS = { active: 'פעיל', vacation: 'בחופשה', hospital: 'באשפוז', left: 'עזב', deceased: 'נפטר' };
const RES_STATUS_CHIP = { active: 'ok', vacation: 'vio', hospital: 'red', left: '', deceased: '' };
const ARR = { couple: 'זוג', with_caregiver: 'עם מטפל/ת זר/ה', other: 'אחר' };
const FUNDS = ['כללית', 'מכבי', 'מאוחדת', 'לאומית'];
const METHOD = { seen: 'ראיתי', phone: 'ענה בטלפון', visit_apartment: 'אותר בדירה', visit_outside: 'אותר מחוץ לבניין' };
const ROUND_STATUS = { open: 'פתוח', completed: 'הושלם', closed_manually: 'נסגר ידנית' };
const SHIFT = { morning: 'בוקר', evening: 'ערב', night: 'לילה' };
const MOVE_TYPES = [
  { id: 'admission', name: 'כניסה לדיור', closer: null, opens_state: 'admission' }, // first movement of every resident; never changes r.status
  { id: 'hospital', name: 'אשפוז', closer: 'חזרה מאשפוז', opens_state: 'hospital' },
  { id: 'vacation', name: 'חופשה', closer: 'חזרה מחופשה', opens_state: 'vacation' },
  { id: 'away', name: 'יציאה זמנית', closer: 'חזרה', opens_state: 'away' },
  { id: 'left', name: 'עזיבה', closer: null, opens_state: 'left' },
  { id: 'deceased', name: 'פטירה', closer: null, opens_state: 'deceased' }];
const MT = Object.fromEntries(MOVE_TYPES.map(t => [t.id, t]));
const HOSPITALS = ['בית חולים לדוגמה – מרכז', 'בית חולים לדוגמה – צפון', 'בית חולים לדוגמה – הר', 'מרכז רפואי לדוגמה'];
const SUBJECTS = ['כללי', 'רפואי', 'התנהגות', 'תחזוקה', 'משפחה'];

function callStats(list) {

  const cl = list.filter(c => c.closed_at).map(c => (Date.parse(c.closed_at) - Date.parse(c.opened_at)) / 36e5);
  const over = list.filter(c => { const t = callTarget(c); if (t == null) return false; const end = c.done_at ? Date.parse(c.done_at) : Date.now(); return !['cancelled'].includes(c.status) && end - Date.parse(c.opened_at) > t; }).length;

}

  out += sec('data', 'נתוני הדגמה', `<p class="hint" style="margin-top:0">כל הנתונים פיקטיביים ונשמרים רק בדפדפן הזה. נוצרו ב-${fDT(S.seeded_at)}.</p>
    <p class="hint" style="margin:0 0 6px;color:var(--warn);font-weight:600" role="note"><span aria-hidden="true">⚠ </span>הקובץ כולל מידע רפואי ומידע על תרופות</p><div class="actions">
    ${inlineConfirm('reset', 'כל השינויים יימחקו והנתונים ייווצרו מחדש. להמשיך?', 'reset-data', 'כן, לאפס') || `<button class="btn danger" data-act="confirm" data-key="reset">איפוס נתוני הדגמה</button>`}
    <button class="btn" data-act="export-json">${ic('download')} ייצוא JSON</button>
    <label class="btn">${ic('upload')} ייבוא JSON<input type="file" accept="application/json,.json" data-ch="import-json" class="sr"></label></div><span class="err" id="import-err"></span>`);

}

function viewHome() {
  const cats = CATS.filter(c => c.perm());
  return `<div class="ph"><h1>ראשי</h1><span class="sub">בחרו תחום</span></div>
  <div class="tiles">${cats.map(c => `<a class="tile cat-${c.id}" href="#/cat/${c.id}"><span class="ti">${ic(c.icon)}</span><b>${c.name}</b><span class="d">${esc(c.desc)}</span></a>`).join('')}</div>`;
}
function catStrip(c, extra = '') { return `<div class="cat-strip cat-${c.id}"><h1>${c.name}</h1>${extra}</div>`; }
function viewCat() {
  const c = catOf(UI.params[0]); if (!c) return '';
  if (CAT_SECTIONS[c.id] && UI.params[1]) return catStrip(c, `<span class="sp"></span><a class="back" href="#/cat/${c.id}">← לרשימת הדיירים</a>`) + (c.id === 'medical' ? viewMedicalFile() : viewResidentFile());
  const quick = c.id === 'admin' ? [['round', 'סבב', 'rounds.run'], ['calls', 'קריאות שירות', 'calls.view'], ['movements', 'תנועות', 'mov.view']].filter(q => may(q[2])).map(([id, name]) => `<a class="btn sm" href="#/${id}">${name}</a>`).join('')
    : c.id === 'medical' && may('catalog.view') ? `<a class="btn sm" href="#/catalog">${ic('pill')} רשימת תרופות (הדגמה)</a>` : '';

}
function asmtOverdueList() { // D20: compact list above the residents list, no tile badge
  const rows = S.residents.filter(r => !isGone(r)).map(r => [r, asmtOverdue(r)]).filter(([, l]) => l.length).sort((a, b) => sortApt(a[0], b[0]));
  if (!rows.length) return '';
  return `<section class="card pad" aria-label="אומדנים באיחור" style="margin-bottom:12px"><h2 style="margin:0 0 6px;font-size:17px">אומדנים באיחור <span class="chip warn">${rows.length}</span></h2><ul class="hist" style="margin:0">
    ${rows.map(([r, l]) => `<li><a href="#/cat/medical/${r.id}"><b>${esc(fullName(r))}</b></a> <small class="muted">דירה ${esc(r.apartment)}</small> · ${l.map(s => `<a href="#/cat/medical/${r.id}/${s}">${esc(ASMT[s].short)}</a> <small class="muted num">(היה מתוכנן ל-${fD(asmtLatest(s, r.id).next_due)})</small>`).join(' · ')}</li>`).join('')}</ul></section>`;
}
function catResidents(c) {
  const view = 'cat_' + c.id, f = F(view, { q: '', status: 'current', sw: '', sort: 'name', dir: 1 });
  const list = S.residents.filter(r => (f.status === 'all' || (f.status === 'current' ? !isGone(r) : r.status === f.status)) && (!f.sw || r.responsible_social_worker_id === f.sw)
    && (!f.q || norm(r.apartment).startsWith(norm(f.q)) || norm(fullName(r)).includes(norm(f.q)) || norm(r.last_name + r.first_name).includes(norm(f.q)) || norm(r.demo_id).includes(norm(f.q))));

    <select data-ch="f" data-view="${view}" data-k="status" aria-label="סטטוס">${opt('current', 'כל הנוכחיים', f.status)}${opt('all', 'כולל עזבו/נפטרו', f.status)}${Object.entries(RES_STATUS).map(([k, v]) => opt(k, v, f.status)).join('')}</select>
    ${c.id === 'social' ? `<select data-ch="f" data-view="${view}" data-k="sw" aria-label="עו״ס אחראי/ת">${opt('', 'כל העו״ס', f.sw)}${socialWorkers().map(u => opt(u.id, 'עו״ס: ' + u.name, f.sw)).join('')}</select>` : ''}
    <span class="sub muted">${list.length} דיירים</span>
  </div>
  ${residentsTable(list, f, view, [
    { label: 'שם מלא', sort: 'name', td: r => `<td><a href="#/cat/${c.id}/${r.id}" data-stop="1"><b>${esc(r.last_name)} ${esc(r.first_name)}</b></a> ${moveBadge(r)}</td>` },
    { label: 'ת״ז (הדגמה)', td: r => `<td class="n">${esc(r.demo_id)}</td>` },
    { label: 'גיל', td: r => `<td class="n">${ageOf(r.birth_date)}</td>` },
    { label: 'דירה', sort: 'apt', td: r => `<td class="n"><b>${esc(r.apartment)}</b></td>` },

    { label: 'טלפון', td: r => `<td class="n">${r.phone ? esc(r.phone) : '<span class="muted">—</span>'}</td>` }],

/* ================================================================
   Medical file (תיק רפואי): header band, right side menu, section engine
   ================================================================ */
const NO_PERM_ACT = 'אין הרשאה לפעולה הזו בתפקיד הנוכחי';
const clinOf = (coll, rid) => (S.clin[coll] || []).filter(x => x.resident_id === rid);
/* R15 (D1, D18, D19, D20): four light nursing assessments (הדגמה). Score, band and next_due are computed, never typed */
const scoreOpts = (labels, vals) => Object.fromEntries(labels.map((l, i) => [String(vals ? vals[i] : i + 1), `${vals ? vals[i] : i + 1} – ${l}`]));
// item keys must not reuse record keys (id, at, by, history, notes, score, band, next_due, correction_of, superseded_by)
const NORTON_ITEMS = [['physical', 'מצב גופני', ['גרוע מאוד', 'גרוע', 'סביר', 'טוב']], ['mental', 'מצב הכרה', ['חסר/ת תגובה', 'מבולבל/ת', 'אדיש/ה', 'ער/ה']],
  ['activity', 'פעילות', ['מרותק/ת למיטה', 'מרותק/ת לכיסא', 'הולך/ת בעזרה', 'הולך/ת לבד']], ['mobility', 'ניידות', ['ללא תנועה', 'מוגבלת מאוד', 'מוגבלת מעט', 'מלאה']],
  ['incontinence', 'שליטה בסוגרים', ['שתן וצואה', 'בדרך כלל שתן', 'לעיתים', 'שליטה מלאה']]].map(([k, label, l]) => ({ k, label, type: 'select', opts: scoreOpts(l), req: 1 }));
const MORSE_ITEMS = [['fall_history', 'היסטוריה של נפילות (3 חודשים אחרונים)', ['לא', 'כן'], [0, 25]], ['secondary', 'אבחנה משנית', ['לא', 'כן'], [0, 15]],
  ['aid', 'עזר הליכה', ['ללא / במיטה / עזרת צוות', 'קביים / מקל / הליכון', 'נשען/ת על רהיטים'], [0, 15, 30]], ['iv', 'עירוי / וריד פתוח', ['לא', 'כן'], [0, 20]],
  ['gait', 'הליכה', ['תקינה / במיטה / כיסא גלגלים', 'חלשה', 'לקויה'], [0, 10, 20]], ['mental', 'מצב מנטלי', ['מודע/ת למגבלות', 'שוכח/ת את המגבלות'], [0, 15]]]
  .map(([k, label, l, v]) => ({ k, label, type: 'select', opts: scoreOpts(l, v), req: 1 }));
const PAINAD_ITEMS = [['p_breathing', 'נשימה', ['תקינה', 'מאומצת לסירוגין', 'רועשת ומאומצת']], ['p_vocal', 'קולות שליליים', ['אין', 'גניחה מדי פעם', 'קריאות / בכי חוזרים']],
  ['p_face', 'הבעת פנים', ['רגועה', 'עצובה / מפוחדת', 'מעוותת']], ['p_body', 'שפת גוף', ['רגועה', 'מתוחה / חסרת מנוחה', 'נוקשה / אגרופים']], ['p_console', 'יכולת הרגעה', ['לא נדרשת', 'נרגע/ת במגע או בדיבור', 'לא ניתן/ת להרגעה']]]
  .map(([k, label, l]) => ({ k, label, type: 'select', opts: scoreOpts(l, [0, 1, 2]), req: 1, when: 'tool:painad' }));
const ASMT_IDS = ['norton', 'morse', 'pain', 'bmi'];
const sumOf = (d, items) => { const v = items.map(it => d[it.k]); return v.some(x => x === '' || x == null) ? null : v.reduce((a, x) => a + +x, 0); };
const ASMT = {
  norton: { short: 'נורטון', max: 20, calc: d => { const s = sumOf(d, NORTON_ITEMS); if (s == null) return null; const b = s >= 15 ? 'נמוך' : s >= 13 ? 'בינוני' : 'גבוה'; return { score: s, band: b, days: { 'גבוה': 7, 'בינוני': 14, 'נמוך': 30 }[b] }; } },
